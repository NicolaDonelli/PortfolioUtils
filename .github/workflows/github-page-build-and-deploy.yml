name: Build and Deploy GithubPage
# See https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-force-orphan-force_orphan for details on Deploy step

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  PublishGithubPage:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.13'
    permissions:
      pages: write
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2.2.2
        with:
          python-version: '3.13'
          architecture: x64

      - name: Compile Requirements
        run: make reqs_dev

      - name: Install
        run: pip install -r requirements/requirements_dev.txt

      - name: Generate content
        run: make --directory=sphinx --file=Makefile html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
          publish_branch: gh_pages
          allow_empty_commit: false
          enable_jekyll: false
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "${{ github.ref_name }} - ${{ github.event.head_commit.message }}"

